name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Run unit tests
        run: .venv/bin/python -m pytest tests/ -q

  allowlist:
    name: Telemetry allowlist up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Check allowlist matches CMO
        run: .venv/bin/python src/sync_telemetry_allowlist.py --check
