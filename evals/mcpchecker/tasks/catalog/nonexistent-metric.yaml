kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  name: "catalog-nonexistent-metric"
  difficulty: easy
  parallel: true
  runs: 1
  labels:
    category: catalog
    suite: openshift-metrics
    toolType: error-handling
  description: |
    Agent should check allowlist/catalog and report that a fake metric is
    not telemetered — without fabricating a live value.
spec:
  verify:
    - llmJudge:
        contains: "the metric is not in telemetry or not found on the allowlist"
  prompt:
    inline: |
      Is fake_nonexistent_metric_zzz_total in OpenShift Telemetry?
      Use the openshift-metrics MCP. Do not invent a numeric value.
