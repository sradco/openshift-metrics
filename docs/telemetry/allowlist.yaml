source: https://raw.githubusercontent.com/openshift/cluster-monitoring-operator/main/manifests/0000_50_cluster-monitoring-operator_04-config.yaml
note: Canonical Telemetry allowlist derived from cluster-monitoring-operator. General metrics under docs/prometheus_metrics/
  are NOT all telemetered.
matches:
- selector: '{__name__=~"cluster:usage:.*"}'
  description: cluster:usage recording rules summarize important usage information about the cluster that
    points to specific features or component usage that may help identify problems or specific workloads.
    For example, cluster:usage:openshift:build:rate24h would show the number of builds executed within
    a 24h period so as to determine whether the current cluster is using builds and may be susceptible
    to eviction due to high disk usage from build temporary directories. All metrics under this prefix
    must have low (1-5) cardinality and must be well-scoped and follow proper naming and scoping conventions.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  metric_name_regex: cluster:usage:.*
  match_type: regex
- selector: '{__name__="count:up0"}'
  description: count:up0 contains the count of cluster monitoring sources being marked as down. This information
    is relevant to the health of the registered cluster monitoring sources on a cluster. This metric allows
    telemetry to identify when an update causes a service to begin to crash-loop or flake.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  metric_name: count:up0
  match_type: exact
- selector: '{__name__="count:up1"}'
  description: count:up1 contains the count of cluster monitoring sources being marked as up. This information
    is relevant to the health of the registered cluster monitoring sources on a cluster. This metric allows
    telemetry to identify when an update causes a service to begin to crash-loop or flake.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  metric_name: count:up1
  match_type: exact
- selector: '{__name__="cluster_version"}'
  description: cluster_version reports what payload and version the cluster is being configured to and
    is used to identify what versions are on a cluster that is experiencing problems.
  owners: (@openshift/openshift-team-cincinnati)
  consumers: (@openshift/openshift-team-cluster-manager)
  metric_name: cluster_version
  match_type: exact
- selector: '{__name__="cluster_version_available_updates"}'
  description: cluster_version_available_updates reports the channel and version server the cluster is
    configured to use and how many updates are available. This is used to ensure that updates are being
    properly served to clusters.
  owners: (@openshift/openshift-team-cincinnati)
  consumers: (@openshift/openshift-team-cluster-manager)
  metric_name: cluster_version_available_updates
  match_type: exact
- selector: '{__name__="cluster_version_capability"}'
  description: cluster_version_capability reports the names of enabled and available cluster capabilities.  This
    is used to gauge the popularity of optional components and exposure to any component-specific issues.
  owners: (@openshift/openshift-team-cincinnati)
  metric_name: cluster_version_capability
  match_type: exact
- selector: '{__name__="cluster_operator_up"}'
  description: cluster_operator_up reports the health status of the core cluster operators - like up,
    an upgrade that fails due to a configuration value on the cluster will help narrow down which component
    is affected.
  owners: (@openshift/openshift-team-cincinnati)
  consumers: (@openshift/openshift-team-olm, @openshift/openshift-team-cluster-manager)
  metric_name: cluster_operator_up
  match_type: exact
- selector: '{__name__="cluster_operator_conditions"}'
  description: cluster_operator_conditions exposes the status conditions cluster operators report for
    debugging. The condition and status are reported.
  owners: (@openshift/openshift-team-cincinnati)
  consumers: (@openshift/openshift-team-olm, @openshift/openshift-team-cluster-manager)
  metric_name: cluster_operator_conditions
  match_type: exact
- selector: '{__name__="cluster_version_payload"}'
  description: cluster_version_payload captures how far through a payload the cluster version operator
    has progressed and can be used to identify whether a particular payload entry is causing failures
    during upgrade.
  owners: (@openshift/openshift-team-cincinnati)
  consumers: (@openshift/openshift-team-cluster-manager)
  metric_name: cluster_version_payload
  match_type: exact
- selector: '{__name__="cluster_installer"}'
  description: cluster_installer reports what installed the cluster, along with its version number and
    invoker.
  owners: (@openshift/openshift-team-installer, @openshift/openshift-team-cincinnati)
  consumers: (@openshift/openshift-team-olm)
  metric_name: cluster_installer
  match_type: exact
- selector: '{__name__="cluster_infrastructure_provider"}'
  description: cluster_infrastructure_provider reports the configured cloud provider if any, along with
    the infrastructure region when running in the public cloud.
  owners: (@openshift/openshift-team-master, @smarterclayton)
  consumers: (@openshift/openshift-team-olm, @openshift/openshift-team-cluster-manager)
  metric_name: cluster_infrastructure_provider
  match_type: exact
- selector: '{__name__="cluster_feature_set"}'
  description: cluster_feature_set reports the configured cluster feature set and whether the feature
    set is considered supported or unsupported.
  owners: (@openshift/openshift-team-master, @smarterclayton)
  metric_name: cluster_feature_set
  match_type: exact
- selector: '{__name__="instance:etcd_object_counts:sum"}'
  description: 'instance:etcd_object_counts:sum identifies two key metrics: - the rough size of the data
    stored in etcd and - the consistency between the etcd instances.'
  owners: (@openshift/openshift-team-etcd, @smarterclayton)
  consumers: (@openshift/openshift-team-olm)
  metric_name: instance:etcd_object_counts:sum
  match_type: exact
- selector: '{__name__="ALERTS",alertstate="firing",severity=~"critical|warning|info|none"}'
  description: alerts are the key summarization of the system state. They are reported via telemetry to
    assess their value in detecting upgrade failure causes and also to prevent the need to gather large
    sets of metrics that are already summarized on the cluster.  Reporting alerts also creates an incentive
    to improve per cluster alerting for the purposes of preventing upgrades from failing for end users.
    Only alerts with valid severity label values are sent. The values are defined by https://github.com/openshift/enhancements/blob/master/enhancements/monitoring/alerting-consistency.md
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-olm, @openshift/openshift-team-cluster-manager)
  metric_name: ALERTS
  match_type: exact
- selector: '{__name__="code:apiserver_request_total:rate:sum"}'
  description: code:apiserver_request_total:rate:sum identifies average of occurences of each http status
    code over 10 minutes The metric will be used for SLA analysis reports.
  owners: (@openshift/ops)
  consumers: (@openshift/openshift-team-olm)
  metric_name: code:apiserver_request_total:rate:sum
  match_type: exact
- selector: '{__name__="cluster:capacity_cpu_cores:sum"}'
  description: cluster:capacity_cpu_cores:sum is the total number of CPU cores in the cluster labeled
    by node role and type.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-olm, @openshift/openshift-team-cluster-manager)
  metric_name: cluster:capacity_cpu_cores:sum
  match_type: exact
- selector: '{__name__="cluster:capacity_memory_bytes:sum"}'
  description: cluster:capacity_memory_bytes:sum is the total bytes of memory in the cluster labeled by
    node role and type.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-cluster-manager)
  metric_name: cluster:capacity_memory_bytes:sum
  match_type: exact
- selector: '{__name__="cluster:cpu_usage_cores:sum"}'
  description: cluster:cpu_usage_cores:sum is the current amount of CPU used by the whole cluster.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-olm, @openshift/openshift-team-cluster-manager)
  metric_name: cluster:cpu_usage_cores:sum
  match_type: exact
- selector: '{__name__="cluster:memory_usage_bytes:sum"}'
  description: cluster:memory_usage_bytes:sum is the current amount of memory in use across the whole
    cluster.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-olm, @openshift/openshift-team-cluster-manager)
  metric_name: cluster:memory_usage_bytes:sum
  match_type: exact
- selector: '{__name__="openshift:cpu_usage_cores:sum"}'
  description: openshift:cpu_usage_cores:sum is the current amount of CPU used by OpenShift components,
    including the control plane and host services (including the kernel).
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-olm)
  metric_name: openshift:cpu_usage_cores:sum
  match_type: exact
- selector: '{__name__="openshift:memory_usage_bytes:sum"}'
  description: openshift:memory_usage_bytes:sum is the current amount of memory used by OpenShift components,
    including the control plane and host services (including the kernel).
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  metric_name: openshift:memory_usage_bytes:sum
  match_type: exact
- selector: '{__name__="workload:cpu_usage_cores:sum"}'
  description: workload:cpu_usage_cores:sum is the current amount of CPU used by cluster workloads, excluding
    infrastructure.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-olm)
  metric_name: workload:cpu_usage_cores:sum
  match_type: exact
- selector: '{__name__="workload:memory_usage_bytes:sum"}'
  description: workload:memory_usage_bytes:sum is the current amount of memory used by cluster workloads,
    excluding infrastructure.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-olm)
  metric_name: workload:memory_usage_bytes:sum
  match_type: exact
- selector: '{__name__="cluster:virt_platform_nodes:sum"}'
  description: cluster:virt_platform_nodes:sum is the number of nodes reporting a particular virt_platform
    type (nodes may report multiple types). This metric helps identify issues specific to a virtualization
    type or bare metal.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-cluster-manager)
  metric_name: cluster:virt_platform_nodes:sum
  match_type: exact
- selector: '{__name__="cluster:node_instance_type_count:sum"}'
  description: cluster:node_instance_type_count:sum is the number of nodes of each instance type and role.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-olm, @openshift/openshift-team-cluster-manager)
  metric_name: cluster:node_instance_type_count:sum
  match_type: exact
- selector: '{__name__="cnv:vmi_status_running:count"}'
  description: cnv:vmi_status_running:count is the total number of VM instances running in the cluster.
  owners: (https://github.com/kubevirt)
  metric_name: cnv:vmi_status_running:count
  match_type: exact
- selector: '{__name__="cnv_abnormal", reason=~"memory_working_set_delta_from_request|memory_rss_delta_from_request"}'
  description: cnv_abnormal represents the reason why the operator might have an issue and includes the
    container, and reason labels.
  owners: (https://github.com/kubevirt)
  metric_name: cnv_abnormal
  match_type: exact
- selector: '{__name__="cluster:vmi_request_cpu_cores:sum"}'
  description: cluster:vmi_request_cpu_cores:sum is the total number of CPU cores requested by pods of
    VMIs.
  owners: (https://github.com/kubevirt)
  metric_name: cluster:vmi_request_cpu_cores:sum
  match_type: exact
- selector: '{__name__="node_role_os_version_machine:cpu_capacity_cores:sum"}'
  description: node_role_os_version_machine:cpu_capacity_cores:sum is the total number of CPU cores in
    the cluster labeled by master and/or infra node role, os, architecture, and hyperthreading state.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-olm, @openshift/openshift-team-cluster-manager)
  metric_name: node_role_os_version_machine:cpu_capacity_cores:sum
  match_type: exact
- selector: '{__name__="node_role_os_version_machine:cpu_capacity_sockets:sum"}'
  description: node_role_os_version_machine:cpu_capacity_sockets:sum is the total number of CPU sockets
    in the cluster labeled by master and/or infra node role, os, architecture, and hyperthreading state.
  owners: (@openshift/openshift-team-monitoring, @smarterclayton)
  consumers: (@openshift/openshift-team-cluster-manager)
  metric_name: node_role_os_version_machine:cpu_capacity_sockets:sum
  match_type: exact
- selector: '{__name__="subscription_sync_total"}'
  description: subscription_sync_total is the number of times an OLM operator Subscription has been synced,
    labelled by name and installed csv
  owners: (@openshift/openshift-team-olm)
  metric_name: subscription_sync_total
  match_type: exact
- selector: '{__name__="olm_resolution_duration_seconds"}'
  description: olm_resolution_duration_seconds is the duration of a dependency resolution attempt.
  owners: (@openshift/openshift-team-olm)
  metric_name: olm_resolution_duration_seconds
  match_type: exact
- selector: '{__name__="csv_succeeded"}'
  description: csv_succeeded is unique to the namespace, name, version, and phase labels.  The metrics
    is always present and can be equal to 0 or 1, where 0 represents that the csv is not in the succeeded
    state while 1 represents that the csv is in the succeeded state.
  owners: (@openshift/openshift-team-olm)
  consumers: (@openshift/openshift-team-cluster-manager)
  metric_name: csv_succeeded
  match_type: exact
- selector: '{__name__="csv_abnormal"}'
  description: csv_abnormal represents the reason why a csv is not in the succeeded state and includes
    the namespace, name, version, phase, reason labels. When a csv is updated, the previous time series
    associated with the csv will be deleted.
  owners: (@openshift/openshift-team-olm)
  consumers: (@openshift/openshift-team-cluster-manager)
  metric_name: csv_abnormal
  match_type: exact
- selector: '{__name__="cluster:kube_persistentvolumeclaim_resource_requests_storage_bytes:provisioner:sum"}'
  description: cluster:kube_persistentvolumeclaim_resource_requests_storage_bytes:provisioner:sum gives
    the total amount of storage requested by PVCs from a particular storage provisioner in bytes. This
    is a generic storage metric.
  owners: (@openshift/team-ocs-committers)
  metric_name: cluster:kube_persistentvolumeclaim_resource_requests_storage_bytes:provisioner:sum
  match_type: exact
- selector: '{__name__="cluster:kubelet_volume_stats_used_bytes:provisioner:sum"}'
  description: cluster:kubelet_volume_stats_used_bytes:provisioner:sum will gives the total amount of
    storage used by PVCs from a particular storage provisioner in bytes.
  owners: (@openshift/team-ocs-committers)
  metric_name: cluster:kubelet_volume_stats_used_bytes:provisioner:sum
  match_type: exact
- selector: '{__name__="ceph_cluster_total_bytes"}'
  description: ceph_cluster_total_bytes gives the size of ceph cluster in bytes. This is a specific OCS
    metric.
  owners: (@openshift/team-ocs-committers)
  metric_name: ceph_cluster_total_bytes
  match_type: exact
- selector: '{__name__="ceph_cluster_total_used_raw_bytes"}'
  description: ceph_cluster_total_used_raw_bytes is the amount of ceph cluster storage used in bytes.
  owners: (@openshift/team-ocs-committers)
  metric_name: ceph_cluster_total_used_raw_bytes
  match_type: exact
- selector: '{__name__="ceph_health_status"}'
  description: ceph_health_status gives the ceph cluster health status
  owners: (@openshift/team-ocs-committers)
  metric_name: ceph_health_status
  match_type: exact
- selector: '{__name__="odf_system_raw_capacity_total_bytes"}'
  description: odf_system_raw_capacity_total_bytes gives the size of storage cluster in bytes. This is
    a specific OCS metric.
  owners: (@openshift/team-ocs-committers)
  metric_name: odf_system_raw_capacity_total_bytes
  match_type: exact
- selector: '{__name__="odf_system_raw_capacity_used_bytes"}'
  description: odf_system_raw_capacity_used_bytes is the amount of storage cluster storage used in bytes.
  owners: (@openshift/team-ocs-committers)
  metric_name: odf_system_raw_capacity_used_bytes
  match_type: exact
- selector: '{__name__="odf_system_health_status"}'
  description: odf_system_health_status gives the storage cluster health status
  owners: (@openshift/team-ocs-committers)
  metric_name: odf_system_health_status
  match_type: exact
- selector: '{__name__="job:ceph_osd_metadata:count"}'
  description: job:ceph_osd_metadata:count is the total count of osds.
  owners: (@openshift/team-ocs-committers)
  metric_name: job:ceph_osd_metadata:count
  match_type: exact
- selector: '{__name__="job:kube_pv:count"}'
  description: job:kube_pv:count is the total number of Persistent Volumes created by ODF present in OCP
    cluster. This metric is deprecated in ODF 4.12, refer to job:odf_system_pvs:count instead.
  owners: (@openshift/team-ocs-committers)
  metric_name: job:kube_pv:count
  match_type: exact
- selector: '{__name__="job:odf_system_pvs:count"}'
  description: job:odf_system_pvs:count is the total number of Persistent Volumes created by ODF present
    in OCP cluster.
  owners: (@openshift/team-ocs-committers)
  metric_name: job:odf_system_pvs:count
  match_type: exact
- selector: '{__name__="job:ceph_pools_iops:total"}'
  description: job:ceph_pools_iops:total is the total iops (reads+writes) value for all the pools in ceph
    cluster
  owners: (@openshift/team-ocs-committers)
  metric_name: job:ceph_pools_iops:total
  match_type: exact
- selector: '{__name__="job:ceph_pools_iops_bytes:total"}'
  description: job:ceph_pools_iops:total is the total iops (reads+writes) value in bytes for all the pools
    in ceph cluster
  owners: (@openshift/team-ocs-committers)
  metric_name: job:ceph_pools_iops_bytes:total
  match_type: exact
- selector: '{__name__="job:ceph_versions_running:count"}'
  description: job:ceph_versions_running:count is the total count of ceph cluster versions running.
  owners: (@openshift/team-ocs-committers)
  metric_name: job:ceph_versions_running:count
  match_type: exact
- selector: '{__name__="job:noobaa_total_unhealthy_buckets:sum"}'
  description: job:noobaa_total_unhealthy_buckets:sum is the total number of unhealthy noobaa buckets
  owners: (@openshift/team-ocs-committers)
  metric_name: job:noobaa_total_unhealthy_buckets:sum
  match_type: exact
- selector: '{__name__="job:noobaa_bucket_count:sum"}'
  description: job:noobaa_bucket_count:sum is the total number of noobaa buckets. This metric is deprecated
    in ODF 4.12, refer to odf_system_bucket_count instead.
  owners: (@openshift/team-ocs-committers)
  metric_name: job:noobaa_bucket_count:sum
  match_type: exact
- selector: '{__name__="job:noobaa_total_object_count:sum"}'
  description: job:noobaa_total_object_count:sum is the total number of noobaa objects. This metric is
    deprecated in ODF 4.12, refer to odf_system_objects_total instead.
  owners: (@openshift/team-ocs-committers)
  metric_name: job:noobaa_total_object_count:sum
  match_type: exact
- selector: '{__name__="odf_system_bucket_count", system_type="OCS", system_vendor="Red Hat"}'
  description: odf_system_bucket_count is the total number of buckets in ODF system
  owners: (@openshift/team-ocs-committers)
  metric_name: odf_system_bucket_count
  match_type: exact
- selector: '{__name__="odf_system_objects_total", system_type="OCS", system_vendor="Red Hat"}'
  description: odf_system_objects_total is the total number of objects in ODF system
  owners: (@openshift/team-ocs-committers)
  metric_name: odf_system_objects_total
  match_type: exact
- selector: '{__name__="noobaa_accounts_num"}'
  description: noobaa_accounts_num gives the count of noobaa's accounts.
  owners: (@openshift/team-ocs-committers)
  metric_name: noobaa_accounts_num
  match_type: exact
- selector: '{__name__="noobaa_total_usage"}'
  description: noobaa_total_usage gives the total usage of noobaa's storage in bytes.
  owners: (@openshift/team-ocs-committers)
  metric_name: noobaa_total_usage
  match_type: exact
- selector: '{__name__="console_url"}'
  description: console_url is the url of the console running on the cluster.
  owners: (@openshift/origin-web-console-committers)
  consumers: (@openshift/openshift-team-cluster-manager)
  metric_name: console_url
  match_type: exact
- selector: '{__name__="cluster:console_auth_login_requests_total:sum"}'
  description: cluster:console_auth_login_requests_total:sum gives the total number of login requests
    initiated from the web console.
  owners: (@openshift/hybrid-application-console-maintainers)
  metric_name: cluster:console_auth_login_requests_total:sum
  match_type: exact
- selector: '{__name__="cluster:console_auth_login_successes_total:sum"}'
  description: 'cluster:console_auth_login_successes_total:sum gives the total number of successful logins
    initiated from the web console. Labels: * `role`, one of `kubeadmin`, `cluster-admin` or `developer`.
    The value is based on whether or not the logged-in user can list all namespaces.'
  owners: (@openshift/hybrid-application-console-maintainers)
  metric_name: cluster:console_auth_login_successes_total:sum
  match_type: exact
- selector: '{__name__="cluster:console_auth_login_failures_total:sum"}'
  description: 'cluster:console_auth_login_failures_total:sum gives the total number of login failures
    initiated from the web console. This might include canceled OAuth logins depending on the user OAuth
    provider/configuration. Labels: * `reason`, currently always `unknown`'
  owners: (@openshift/hybrid-application-console-maintainers)
  metric_name: cluster:console_auth_login_failures_total:sum
  match_type: exact
- selector: '{__name__="cluster:console_auth_logout_requests_total:sum"}'
  description: 'cluster:console_auth_logout_requests_total:sum gives the total number of logout requests
    sent from the web console. Labels: * `reason`, currently always `unknown`'
  owners: (@openshift/hybrid-application-console-maintainers)
  metric_name: cluster:console_auth_logout_requests_total:sum
  match_type: exact
- selector: '{__name__="cluster:console_usage_users:max"}'
  description: 'cluster:console_usage_users:max contains the number of web console users splitten into
    the roles. Labels: * `role`: `kubeadmin`, `cluster-admin` or `developer`. The value is based on whether
    or not the user can list all namespaces.'
  owners: (@openshift/hybrid-application-console-maintainers)
  metric_name: cluster:console_usage_users:max
  match_type: exact
- selector: '{__name__="cluster:console_plugins_info:max"}'
  description: 'cluster:console_plugins_info:max reports information about the web console plugins and
    their state. Labels: * `name`: `redhat`, `demo` or `other`. * `state`: `enabled`, `disabled` or `notfound`'
  owners: (@openshift/hybrid-application-console-maintainers)
  metric_name: cluster:console_plugins_info:max
  match_type: exact
- selector: '{__name__="cluster:console_customization_perspectives_info:max"}'
  description: 'cluster:console_customization_perspectives_info:max reports information about customized
    web console perspectives. Labels: * `name`, one of `admin`, `dev`, `acm` or `other` * `state`, one
    of `enabled`, `disabled`, `only-for-cluster-admins`, `only-for-developers` or `custom-permissions`'
  owners: (@openshift/hybrid-application-console-maintainers)
  metric_name: cluster:console_customization_perspectives_info:max
  match_type: exact
- selector: '{__name__="cluster:ovnkube_controller_egress_routing_via_host:max"}'
  description: cluster:ovnkube_controller_egress_routing_via_host:max informs if the OVN-K cluster's gateway
    mode is `routingViaOVN` (0), `routingViaHost` (1) or invalid (2).
  owners: (@openshift/networking)
  metric_name: cluster:ovnkube_controller_egress_routing_via_host:max
  match_type: exact
- selector: '{__name__="cluster:ovnkube_controller_admin_network_policies_db_objects:max",table_name=~"ACL|Address_Set"}'
  description: 'cluster:ovnkube_controller_admin_network_policies_db_objects:max informs the total number
    of OVN database objects (table_name) owned by admin network policies in the cluster. Labels: * `table_name`:
    `ACL` or `Address_Set`.'
  owners: (@openshift/networking)
  metric_name: cluster:ovnkube_controller_admin_network_policies_db_objects:max
  match_type: exact
- selector: '{__name__="cluster:ovnkube_controller_baseline_admin_network_policies_db_objects:max",table_name=~"ACL|Address_Set"}'
  description: 'cluster:ovnkube_controller_baseline_admin_network_policies_db_objects:max informs the
    total number of OVN database objects (table_name) owned by baseline admin network policies in the
    cluster. Labels: * `table_name`: `ACL` or `Address_Set`.'
  owners: (@openshift/networking)
  metric_name: cluster:ovnkube_controller_baseline_admin_network_policies_db_objects:max
  match_type: exact
- selector: '{__name__="cluster:ovnkube_controller_admin_network_policies_rules:max",direction=~"Ingress|Egress",action=~"Pass|Allow|Deny"}'
